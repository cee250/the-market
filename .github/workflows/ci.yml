name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U market -d market"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run audit:high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:production-config -w server
      - run: npm run test:e2e:smoke
        env:
          E2E_SKIP_DB: '1'
          E2E_DATABASE_URL: postgresql://market:market@127.0.0.1:5433/market
          ADMIN_EMAIL: admin@market.rw
          ADMIN_PASSWORD: ChangeMe123!
      - run: docker build --file server/Dockerfile --tag market-api:ci .
