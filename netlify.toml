[build]
  command = "npm install --include=dev --workspaces && npm run db:migrate -w server && npm run build -w client"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  external_node_modules = ["@nestjs/microservices", "@nestjs/websockets", "mysql2", "sqlite3", "better-sqlite3", "oracledb", "tedious", "pg-native"]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
